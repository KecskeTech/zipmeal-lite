<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4630eb">
<meta name="description" content="Nem hivatalos, offline is használható ZipMeal ebédválasztó (PWA).">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZipMeal Lite">
<title>ZipMeal Lite – ebédválasztó</title>
<link rel="manifest" href="manifest.json">
<link rel="license" href="LICENSE">
<link rel="stylesheet" href="styles.css">
<link rel="favicon" href="https://raw.githubusercontent.com/KecskeTech/zipmeal-lite/refs/heads/main/icon.svg" type="image/x-icon">
</head>
<body>
  <!-- LOGIN -->
  <div id="login-view" class="view login-view">
    <form id="login-form" class="login-card">
      <div class="login-logo">🍽️</div>
      <h1>ZipMeal <span>Lite</span></h1>
      <p class="subtitle">Ebédválasztás, ahogy kellene</p>
      <div class="login-fields">
        <label>Email
          <input type="email" id="login-email" autocomplete="email" required>
        </label>
        <label>Jelszó
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
      </div>
      <button type="submit" class="btn primary lg">Bejelentkezés</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <!-- DINER / CHILD SELECTOR (parent accounts) -->
  <div id="diner-view" class="view diner-view" hidden>
    <div class="diner-card">
      <div class="diner-logo">👨‍👩‍👧</div>
      <h1>Étkező kiválasztása</h1>
      <p class="subtitle">Melyik gyermeked ebédjét szeretnéd kezelni?</p>
      <div id="diner-list" class="diner-list"></div>
      <p id="diner-error" class="error" hidden></p>
      <button id="diner-logout" class="btn ghost small">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>Kilépés
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main-view" hidden>
    <header class="topbar">
      <div class="view topbar-inner">
        <span id="user-avatar" class="avatar">?</span>
        <div class="user-info">
          <span id="user-name" class="user-name"></span>
          <span id="user-group" class="user-group"></span>
        </div>
        <button id="switch-diner-btn" class="btn ghost small" title="Étkező váltása" hidden>
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>Gyermek
        </button>
        <button id="logout-btn" class="btn ghost small" title="Kilépés">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>Kilépés
        </button>
      </div>
    </header>

    <p id="offline-banner" class="offline-banner" hidden></p>

    <div class="view">
      <div class="week-nav">
        <button id="prev-week" class="btn nav" aria-label="Előző hét">‹</button>
        <span id="week-label" class="week-nav-label" aria-live="polite">
          <b id="week-number"></b>
          <small id="week-dates"></small>
        </span>
        <button id="next-week" class="btn nav" aria-label="Következő hét">›</button>
      </div>

      <main id="days" class="days"></main>
      <p id="status" class="toast" hidden></p>
      <footer class="foot">
        ZipMeal Lite – nem hivatalos kliens · AGPL-3.0 ·
        <a href="https://github.com/KecskeTech/zipmeal-lite" target="_blank" rel="noopener">forráskód</a>
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
